# Action test/validation workflow
name: 'Test GitHub Action 🧪'

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  ### Test the GitHub Action in this Repository ###
  tests:
    name: 'Test local GitHub Action'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25 # Increase this timeout value as needed
    steps:
      - name: 'Checkout sample O-RAN-SC repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Caution: this is a live project and may change at any time
          repository: 'o-ran-sc/oam-oam-controller'
          path: 'oam-oam-controller'

      - name: "Running local action: ${{ github.repository }}"
        uses: $/
        with:
          java-version: '21'
          mvn-version: '3.9.5'
          # Not 'build': its features-odlux step cannot resolve. Since the
          # project's commit 21c8ed6 ("Update parents") it builds oparent
          # 14.0.1-SNAPSHOT, while features/sdnr/odlux/odlux/pom.xml still
          # names 14.0.0-SNAPSHOT, which no repository publishes. Only a
          # warm ~/.m2 cache from before that commit hid it. Return to
          # 'build' once the project fixes that parent reference.
          make-targets: 'parents features-wt'
          path_prefix: 'oam-oam-controller'

      # The build must run on the JDK and Maven the inputs ask for.
      # Until s4u/setup-maven-action was dropped it installed a second
      # JDK, its own default Zulu, after the requested Temurin one, so
      # JAVA_HOME pointed at Zulu whatever 'distribution' said.
      - name: 'Verify the requested toolchain'
        shell: bash
        run: |
          # Verify the requested toolchain
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME}"
          case "${JAVA_HOME}" in
            *Temurin*) ;;
            *)
              echo "::error::JAVA_HOME is not the default Temurin JDK"
              exit 1
              ;;
          esac
          mvn_version=$(mvn --version)
          echo "${mvn_version}"
          if ! grep -q '^Apache Maven 3\.9\.5 ' <<< "${mvn_version}"; then
            echo "::error::mvn is not the requested Maven 3.9.5"
            exit 1
          fi
          if ! grep -q '^Java version: 21\.' <<< "${mvn_version}"; then
            echo "::error::Maven does not run on the requested Java 21"
            exit 1
          fi
          if ! grep -q '<id>github</id>' "${HOME}/.m2/settings.xml"; then
            echo "::error::~/.m2/settings.xml lacks the github server"
            exit 1
          fi
